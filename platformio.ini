; K3NG Rotator Controller — PlatformIO project
; Two environments:
;   native_test  — compiles real K3NG code against PC simulator (no MCU required)
;   teensy41     — production build for Teensy 4.1

[platformio]
default_envs = native_test
src_dir = k3ng_rotator_controller

; ── shared native build settings ─────────────────────────────────────────────
[env:native_base]
platform = native
extra_scripts = pre:extra_scripts/gen_ino_declarations.py
build_flags =
    -DNATIVE_BUILD
    -DARDUINO=100
    -std=c++17
build_src_filter =
    -<*>
    +<native_k3ng.cpp>
    +<rotator_hal_native.cpp>
    +<rotator_simulator.cpp>
    +<rotator_k3ngdisplay.cpp>
    +<rotator_debug.cpp>
lib_deps =
    arduino_compat
lib_extra_dirs =
    lib

; ── native PC test build — minimal config ────────────────────────────────────
; Single-ended pot, relay motor, 180-630° range. Good starting point.
[env:native_test]
extends = env:native_base
build_flags =
    ${env:native_base.build_flags}
    -DHARDWARE_NATIVE_TEST

; ── native PC test build — HCO board config ──────────────────────────────────
; WA1HCO Teensy 4.0 board: 0-360°, simulated at 12°/s (~30s full sweep).
; Note: dual-end pot and H-bridge motor are approximated until HAL gains
; full support for those paths (track 2).
[env:native_hco_board]
extends = env:native_base
build_flags =
    ${env:native_base.build_flags}
    -DHARDWARE_HCO_BOARD

; ── Teensy 4.0 production build ───────────────────────────────────────────────
[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps = leemangeophysicalllc/FIR filter@^0.1.1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; ── Teensy 4.1 production build ───────────────────────────────────────────────
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = leemangeophysicalllc/FIR filter@^0.1.1
