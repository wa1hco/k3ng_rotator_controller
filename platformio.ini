; K3NG Rotator Controller — PlatformIO project
; Two environments:
;   native_test  — compiles real K3NG code against PC simulator (no MCU required)
;   teensy41     — production build for Teensy 4.1

[platformio]
default_envs = native_test
src_dir = k3ng_rotator_controller

; ── native PC test build ──────────────────────────────────────────────────────
[env:native_test]
platform = native
extra_scripts = pre:extra_scripts/gen_ino_declarations.py
build_flags =
    -DNATIVE_BUILD
    -DHARDWARE_NATIVE_TEST
    -DARDUINO=100
    -std=c++17
build_src_filter =
    -<*>
    +<native_k3ng.cpp>
    +<rotator_hal_native.cpp>
    +<rotator_simulator.cpp>
    +<rotator_k3ngdisplay.cpp>
    +<rotator_debug.cpp>
lib_deps =
    arduino_compat
lib_extra_dirs =
    lib

; ── Teensy 4.1 production build ───────────────────────────────────────────────
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DHARDWARE_NATIVE_TEST
